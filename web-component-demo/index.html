<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documents2 — Web Component</title>
    <script type="module" src="./main.js"></script>
    <script type="module" src="./demo.js"></script>
  </head>
  <body>
    <h1>Documents2 — HTML i JavaScript</h1>
    <p id="startup" role="status">Ładowanie komponentu…</p>

    <template id="documents-demo">
      <form>
        <baw-documents></baw-documents>
