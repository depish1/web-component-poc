<div>
  <select [value]="selectedRepository()" (change)="setRepository($event)">
    <option value="A">Repository A</option>
    <option value="B">Repository B</option>
  </select>
  <button type="button" (click)="handleGetDocuments()">Pobierz zapisane dokumenty</button>
  <button type="button" (click)="commit()">Zatwierdź</button>
</div>
<app-documents
  #repoA
  [title]="title()"
  [synchronizationMode]="synchronizationMode()"
  [repositoryType]="selectedRepository()"
  (documentsChanged)="handleDocumentsChange($event)"
  (documentAdded)="handleDocumentAdd($event)"
  (documentRemoved)="handleDocumentRemove($event)"
/>
